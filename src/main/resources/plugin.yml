name: Kreiscraft
version: '${project.version}'
main: de.kreiscraft.Kreiscraft
api-version: '1.21'
author: OfficerYoda
description: Combined Kreiscraft plugin (gameplay + web API)
permissions:
  kreiscraft.admin.gamemode: { description: Change gamemode, default: op }
  kreiscraft.admin.item: { description: Spawn items, default: op }
  kreiscraft.admin.skull: { description: Get a player head, default: op }
  kreiscraft.admin.head: { description: Swap held item and helmet, default: op }
  kreiscraft.admin.weather: { description: Change weather, default: op }
  kreiscraft.admin.spawnmob: { description: Spawn mobs, default: op }
  kreiscraft.admin.ip: { description: See a player's IP, default: op }
  kreiscraft.admin.uuid: { description: See a player's UUID, default: op }
  kreiscraft.admin.lastonline: { description: See a player's last-online time, default: op }
  kreiscraft.admin.ping: { description: See a player's ping, default: true }
  kreiscraft.admin.tps: { description: See server TPS, default: true }
  kreiscraft.admin.statistic: { description: See a player's statistic, default: op }
  kreiscraft.admin.sudo: { description: Force a player to run chat/command, default: op }
  kreiscraft.admin.help: { description: Open Kreiscraft help links, default: true }
  kreiscraft.anticheat.view:
    description: View hack logs
    default: op
  kreiscraft.bedrock.admin:
    description: Manage the bedrock whitelist
    default: op
  kreiscraft.combat.admin:
    description: Manually tag a player as in combat
    default: op
  kreiscraft.effects.use:
    description: Toggle particle trail
    default: true
  kreiscraft.glow.use:
    description: Toggle glow effect
    default: true
  kreiscraft.invsee.view:
    description: View another player's inventory
    default: op
  kreiscraft.invsee.edit:
    description: Edit another player's inventory
    default: op
  kreiscraft.jail.use:
    description: Jail and unjail players
    default: op
  kreiscraft.jail.bypass:
    description: Cannot be jailed
    default: op
  kreiscraft.pluginhider.admin:
    description: Manage the plugin-hider allowlist
    default: op
  kreiscraft.pluginhider.bypass:
    description: See all commands regardless of the allowlist
    default: op
  kreiscraft.positions.use:
    description: Save/teleport to personal positions
    default: true
  kreiscraft.reboot.admin:
    description: Trigger or cancel a server restart
    default: op
  kreiscraft.settingsgui.use:
    description: Open the per-player settings GUI
    default: true
  kreiscraft.signcolor.use:
    description: Use MiniMessage on signs
    default: true
  kreiscraft.signcolor.anvil:
    description: Use MiniMessage in anvil rename
    default: true
  kreiscraft.spawn.use:
    description: Teleport to spawn
    default: true
  kreiscraft.spawn.set:
    description: Set the server spawn point
    default: op
  kreiscraft.startsequence.admin:
    description: Trigger the season start sequence
    default: op
  kreiscraft.status.set.self:
    description: Set your own status prefix/suffix
    default: true
  kreiscraft.status.set.other:
    description: Set another player's status
    default: op
  kreiscraft.updatemode.admin:
    description: Toggle maintenance mode
    default: op
  kreiscraft.updatemode.bypass:
    description: Log in during maintenance mode
    default: op
  kreiscraft.worldmgmt.world:
    description: Teleport between worlds
    default: op
  kreiscraft.worldmgmt.setworldspawn:
    description: Set the spawn point of the current world
    default: op
  kreiscraft.worldmgmt.portal:
    description: Compute portal coordinate translations
    default: true
