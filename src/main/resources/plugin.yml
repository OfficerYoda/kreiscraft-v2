name: Kreiscraft
version: "${project.version}"
main: de.kreiscraft.Kreiscraft
api-version: "26.2"
author: OfficerYoda
description: Combined Kreiscraft plugin (gameplay + web API)
permissions:
  kreiscraft.admin.item:
    description: Spawn items
    default: op
  kreiscraft.admin.skull:
    description: Get a player head
    default: op
  kreiscraft.admin.head:
    description: Swap held item and helmet
    default: op
  kreiscraft.admin.spawnmob:
    description: Spawn mobs
    default: op
  kreiscraft.admin.ip:
    description: See a player's IP
    default: op
  kreiscraft.admin.uuid:
    description: See a player's UUID
    default: op
  kreiscraft.admin.lastonline:
    description: See a player's last-online time
    default: op
  kreiscraft.admin.ping:
    description: See a player's ping
    default: true
  kreiscraft.admin.tps:
    description: See server TPS
    default: true
  kreiscraft.admin.statistic:
    description: See a player's statistic
    default: op
  kreiscraft.admin.sudo:
    description: Force a player to run chat/command
    default: op
  kreiscraft.admin.help:
    description: Open Kreiscraft help links
    default: true
  kreiscraft.ai-chat.use:
    description: Trigger ai calls from the chat
    default: true
  kreiscraft.ai-chat.stats:
    description: View AI chat usage statistics
    default: op
  kreiscraft.anticheat.view:
    description: View hack logs
    default: op
  kreiscraft.api.link:
    description: Link a browser session to a Bukkit account via /link-player
    default: true
  kreiscraft.bedrock.admin:
    description: Manage the bedrock whitelist
    default: op
  kreiscraft.combat.admin:
    description: Manually tag a player as in combat
    default: op
  kreiscraft.effects.use:
    description: Toggle particle trail
    default: true
  kreiscraft.invsee.use:
    description: View and edit another player's inventory or ender chest
    default: op
  kreiscraft.jail.use:
    description: Jail and unjail players
    default: op
  kreiscraft.jail.bypass:
    description: Cannot be jailed
    default: op
  kreiscraft.jail.set:
    description: Set the jail location to your current position
    default: op
  kreiscraft.positions.use:
    description: Save and inspect personal positions
    default: true
  kreiscraft.positions.teleport:
    description: Teleport by clicking a position in the GUI
    default: op
  kreiscraft.reboot.admin:
    description: Trigger or cancel a server restart
    default: op
  kreiscraft.settingsgui.use:
    description: Open the per-player settings GUI
    default: true
  kreiscraft.settingsgui.admin:
    description: Open the Server Configuration editor from Player Settings or /settings admin
    default: op
  kreiscraft.signcolor.use:
    description: Use legacy colours, placeholders and MiniMessage on signs
    default: true
  kreiscraft.signcolor.anvil:
    description:
      Use legacy colours, placeholders and MiniMessage in anvil rename
    default: true
  kreiscraft.sit.use:
    description: Sit down or stand up
    default: true
  kreiscraft.spawn.use:
    description: Teleport to spawn
    default: true
  kreiscraft.spawn.set:
    description: Set the server spawn point
    default: op
  kreiscraft.startsequence.admin:
    description: Trigger the season start sequence
    default: op
  kreiscraft.status.set.self:
    description: Set your own status prefix/suffix
    default: true
  kreiscraft.updatemode.admin:
    description: Toggle maintenance mode
    default: op
  kreiscraft.updatemode.bypass:
    description: Log in during maintenance mode
    default: op
  kreiscraft.worldmgmt.world:
    description: Teleport between worlds
    default: op
  kreiscraft.worldmgmt.portal:
    description: Compute portal coordinate translations
    default: true
  kreiscraft.worldmgmt.dimension:
    description: Enable or disable Nether and End portal access
    default: op
