# Kreiscraft configuration.
# See docs/configuration.md for a full reference of every module and key.
core:
  language: de
  timezone: Europe/Berlin
  auto-save-interval: 5m
  debug: false

modules:
  admin:
    enabled: false
    timezone: "UTC"
    links:
      website: "https://kreiscraft.de"
      discord: "https://discord.gg/example"
      youtube: "https://youtube.com/@example"
  anti-cheat:
    enabled: false
    channel: "kreiscraft:mod_checker"
    kick-on-fabric-forge: true
    handshake-grace-duration: 5s
  bedrock:
    enabled: false
    prefix: "."
  bot:
    enabled: false
  chat-format:
    enabled: false
    event-priority: LOWEST
    allow-mini-message-in-body: false
    format: "<team-prefix><name-colored><team-suffix><gray>: <reset><body>"
  clickthrough:
    enabled: false
    target-block-max-distance: 6
  combat:
    enabled: false
    tag-duration: 10s
    disable-elytra: true
    excluded-worlds: ["Lobby"]
    default-display: ACTIONBAR
  effects:
    enabled: false
    default-particle: HAPPY_VILLAGER
    count: 25
    offset-x: 0.9
    offset-y: 0.9
    offset-z: 0.9
    force: true
  firework:
    enabled: false
    custom-model-data: 696969
    namespace-key: "kreiscraft:firework_rocket"
  glow:
    enabled: false
  invsee:
    enabled: false
  jail:
    enabled: false
    location: { world: world, x: 126, y: 91, z: 92, yaw: 0, pitch: 0 }
    blocked-commands: [msg, tell, w, pay, r]
  plugin-hider:
    enabled: false
    default-allowed-commands:
      - help
      - spawn
      - msg
      - tell
      - w
      - r
      - tps
      - ping
      - status
  positions:
    enabled: false
    gui-rows: 6
    teleport-on-click: true
