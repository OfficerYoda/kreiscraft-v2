[versions]
paper = "26.1.2.build.72-stable"
shadow = "9.6.1"
spotless = "8.9.0"
runPaper = "3.0.2"
configurate = "4.1.2"
javalin = "6.1.3"
jackson = "2.16.1"
slf4j = "2.0.9"
invui = "1.44"
junit = "6.1.2"
mockito = "5.20.0"
mockbukkit = "4.115.0"
assertj = "3.25.3"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
invui = { module = "xyz.xenondevs.invui:invui", version.ref = "invui" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.1.2", version.ref = "mockbukkit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "runPaper" }
