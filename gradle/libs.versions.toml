[versions]
paper = "1.21.11-R0.1-SNAPSHOT"
paperweight = "2.0.0-beta.18"
shadow = "8.3.0"
spotless = "6.25.0"
runPaper = "2.3.1"
configurate = "4.1.2"
javalin = "6.1.3"
jackson = "2.16.1"
slf4j = "2.0.9"
invui = "1.44"
junit = "5.10.2"
mockito = "5.12.0"
mockbukkit = "4.34.0"
assertj = "3.25.3"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
invui = { module = "xyz.xenondevs.invui:invui", version.ref = "invui" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v1.21", version.ref = "mockbukkit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "runPaper" }
