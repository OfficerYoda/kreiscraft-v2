name: Build and deploy docs
description: Build the Starlight site, validate OpenAPI, and optionally deploy it.

inputs:
  deploy:
    description: Deploy the validated build to the documentation site
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.4.0"

    - name: Install dependencies
      shell: bash
      working-directory: docs-site
      run: bun install --frozen-lockfile

    - name: Build
      shell: bash
      working-directory: docs-site
      run: bun run build

    - name: Lint OpenAPI specification
      shell: bash
      working-directory: docs-site
      run: bun run lint:openapi

    - name: Deploy
      if: inputs.deploy == 'true'
      shell: bash
      working-directory: docs-site
      run: curl -fsSL https://forgejo.officeryoda.dev/OfficerYoda/site-deploy/raw/branch/main/deploy.sh | bash
      env:
        SRC: dist
        SITE: docs.kreiscraft
