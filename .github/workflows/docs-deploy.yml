name: Build and deploy docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/actions/build-docs/**"
      - ".github/workflows/docs-deploy.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/actions/build-docs/**"
      - ".github/workflows/docs-deploy.yml"

concurrency:
  # Serialise deploys so two builds never write the site directory at once.
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Queued pushes build the latest branch, not an older event SHA that
          # could overwrite a newer generated-docs deployment. PRs keep their SHA.
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}

      - name: Build and deploy docs
        uses: ./.github/actions/build-docs
        with:
          deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
