name: Sync docs (incremental)

# Runs on every push to the default branch. Reads the diff, asks the LLM to
# update any affected docs, commits the result back, and deploys site changes.
# Forgejo suppresses workflow triggers for built-in Actions-token pushes, so
# deployment must happen here rather than relying on the docs commit's on.push.
# Returns targeted edits, with at most one correction call for failed anchors.
#
# Path filter: skips runs when only docs, workflow files, or the root README
# changed. That covers both the auto-doc commit itself and pure-doc PRs.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - ".github/**"
      - "README.md"

concurrency:
  # Share the deploy lock with manual rebuilds and ordinary docs pushes.
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          # Full history: github.event.before can point arbitrarily far back
          # when a push includes multiple commits, so a shallow clone is not
          # safe for computing the incremental diff.
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Test documentation editor
        run: python -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Update docs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_APP: kreiscraft-docs-ci
          OPENROUTER_REFERER: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ -z "$OPENROUTER_MODEL" ]; then
            echo "::error::repository variable OPENROUTER_MODEL is not set"
            exit 1
          fi
          base_ref="${{ github.event.before }}"
          # On the first push that creates a branch on the remote, both GitHub
          # and Forgejo report `before` as 40 zeros. There is no previous
          # commit to diff against, so exit cleanly instead of crashing.
          if [ "$base_ref" = "0000000000000000000000000000000000000000" ]; then
            echo "First push to branch — no previous commit to diff against, skipping."
            exit 0
          fi
          python .github/scripts/update_docs.py \
            --mode=incremental \
            --base-ref="$base_ref" \
            --head-ref="${{ github.sha }}"

      - name: Commit and push changes
        id: push_docs
        run: |
          bash .github/scripts/push_docs.sh \
            "docs: sync with $(git rev-parse --short "${{ github.sha }}")" \
            "${{ github.ref_name }}"

      - name: Build and deploy generated docs
        if: steps.push_docs.outputs.docs_changed == 'true' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/build-docs
        with:
          deploy: "true"
