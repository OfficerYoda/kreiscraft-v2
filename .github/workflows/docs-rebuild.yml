name: Rebuild docs (manual)

# Manually triggered full review of all docs against the current source of
# truth, returning targeted edits. Use this after major
# refactors or when the incremental pipeline has fallen behind.
#
# Cost: 1 bulk API call, plus at most 1 correction call for failed edit anchors.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing files or committing"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      model:
        description: "OpenRouter model slug (overrides repo variable)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Test documentation editor
        run: python -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Rebuild docs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.model != '' && inputs.model || vars.OPENROUTER_MODEL }}
          OPENROUTER_APP: kreiscraft-docs-ci
          OPENROUTER_REFERER: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ -z "$OPENROUTER_MODEL" ]; then
            echo "::error::no model specified: set repository variable OPENROUTER_MODEL or provide the 'model' workflow input"
            exit 1
          fi
          extra=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            extra="--dry-run"
          fi
          python .github/scripts/update_docs.py --mode=rebuild $extra

      - name: Commit and push changes
        id: push_docs
        if: inputs.dry_run != 'true'
        run: |
          bash .github/scripts/push_docs.sh \
            "docs: full rebuild via workflow_dispatch" \
            "${{ github.ref_name }}"

      # Actions-token pushes do not trigger docs-deploy.yml; deploy directly.
      - name: Build and deploy generated docs
        if: steps.push_docs.outputs.docs_changed == 'true' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/build-docs
        with:
          deploy: "true"
