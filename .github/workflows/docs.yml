name: Build and deploy docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl -fsSL https://forgejo.officeryoda.dev/OfficerYoda/site-deploy/raw/branch/main/deploy.sh | bash
        env:
          SRC: dist
          SITE: kreiscraft
